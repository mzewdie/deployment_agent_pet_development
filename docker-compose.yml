version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pet-app:local-test
    container_name: pet-app-local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
